// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// BUILDCONFIG-FIX-V5
// Turn on BuildConfig for Android app + library modules. Use each module's own
// `android` extension (AGP 9 types both have buildFeatures). Casting to the old
// AppExtension/LibraryExtension types fails on AGP 9 ("Could not find method
// buildFeatures()"), and afterEvaluate {} fails because the React Native root
// plugin evaluates subprojects early.
subprojects { sub ->
    ['com.android.library', 'com.android.application'].each { pid ->
        sub.plugins.withId(pid) {
            sub.extensions.getByName('android').buildFeatures.buildConfig = true
        }
    }
}
